<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>คลังไฟล์ เมืองพลเมือง</title></head><body style="font-family:sans-serif;padding:2rem"><h1>คลังไฟล์ของเกม "เมืองพลเมือง"</h1><p>หน้านี้เก็บภาพ แผนที่ และโมเดลตัวละครที่เกมเรียกใช้ ตัวเกมเปิดผ่านลิงก์ที่ครูให้เท่านั้น</p></body></html>
